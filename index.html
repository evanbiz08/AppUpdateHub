<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FigmaRestore | 版本与发布中心</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-bold: #f0f6fc;
      --accent: #58a6ff;
      --badge-bg: rgba(56, 139, 253, 0.15);
      --badge-border: rgba(56, 139, 253, 0.4);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 40px 20px;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 28px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 18px;
    }
    h1 {
      color: var(--text-bold);
      font-size: 24px;
      margin: 0 0 6px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .subtitle {
      color: #8b949e;
      font-size: 13.5px;
      margin: 0;
    }
    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 22px;
    }
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .app-title-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .app-name {
      color: var(--text-bold);
      font-size: 18px;
      font-weight: 600;
    }
    .version-tag {
      background: var(--badge-bg);
      border: 1px solid var(--badge-border);
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 12px;
      font-family: monospace;
    }
    .notes-box {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 6px;
      padding: 14px 16px;
      font-size: 13px;
      line-height: 1.65;
      margin-bottom: 16px;
      white-space: pre-wrap;
      color: #b1bac4;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .app-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #8b949e;
    }
    .btn-download {
      background: #238636;
      color: #fff;
      text-decoration: none;
      padding: 6px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      transition: background 0.15s;
    }
    .btn-download:hover {
      background: #2ea043;
    }
    code {
      background: rgba(110, 118, 129, 0.2);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
      color: #f0f6fc;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>✨ FigmaRestore 版本中心</h1>
      <p class="subtitle">基于 Sparkle 2、GitHub Raw 与 EdDSA 签名的应用更新分发</p>
    </header>

    <div class="app-card">
      <div class="app-header">
        <div class="app-title-area">
          <span class="app-name" id="appName">FigmaRestore</span>
          <span class="version-tag" id="appVersion">v1.0.0</span>
        </div>
        <span>更新源: <code>appcast.xml</code></span>
      </div>
      <div class="notes-box" id="appNotes">FigmaRestore 1.0.0

- 支持 Figma 页面高保真还原、已有页面改造和多目标隔离处理。
- 强化语义所有权审计，避免将可本地化文字与背景合并为整卡切图。
- 优化 AGY Session、流水日志、结果状态和诊断包导出。
- 接入 Sparkle 2，支持应用内检查、下载、验证、安装并重启更新。</div>
      <div class="app-footer">
        <span>签名校验: <code>EdDSA</code></span>
        <a href="#" id="btnDownload" class="btn-download" target="_blank" rel="noopener">⬇️ 下载最新安装包</a>
      </div>
    </div>
  </div>

  <script>
    async function loadData() {
      try {
        if (location.protocol.startsWith('http')) {
          const res = await fetch('appcast.xml', { cache: 'no-store' });
          if (res.ok) {
            const xml = new DOMParser().parseFromString(await res.text(), 'application/xml');
            const item = xml.querySelector('channel > item');
            if (!item) return;

            const versionNode = item.getElementsByTagNameNS('*', 'shortVersionString')[0];
            const enclosure = item.querySelector('enclosure');
            const description = item.querySelector('description');
            const parserError = xml.querySelector('parsererror');
            if (parserError) throw new Error('Invalid appcast XML');

            document.getElementById('appVersion').textContent = 'v' + (versionNode?.textContent || '1.0.0');
            document.getElementById('appNotes').textContent = description?.textContent || '暂无更新说明';
            document.getElementById('btnDownload').href = enclosure?.getAttribute('url') || '#';
          }
        }
      } catch (e) {
        console.log('Using default static preview:', e);
      }
    }
    loadData();
  </script>
</body>
</html>
