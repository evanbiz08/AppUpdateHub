<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>AppUpdateHub</title>
  <style>
    :root {
      --bg: #f3f4f7;
      --surface: rgba(255, 255, 255, .72);
      --surface-solid: #fff;
      --surface-soft: rgba(120, 120, 128, .08);
      --text: #161617;
      --secondary: #6e6e73;
      --tertiary: #9a9aa0;
      --line: rgba(60, 60, 67, .12);
      --accent: #087cff;
      --accent-soft: rgba(8, 124, 255, .12);
      --success: #25a244;
      --warning: #f09a20;
      --danger: #e5484d;
      --shadow: 0 22px 65px rgba(0, 0, 0, .11), 0 2px 8px rgba(0, 0, 0, .04);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111113;
        --surface: rgba(35, 35, 38, .76);
        --surface-solid: #242427;
        --surface-soft: rgba(255, 255, 255, .055);
        --text: #f4f4f5;
        --secondary: #aaaab0;
        --tertiary: #77777e;
        --line: rgba(255, 255, 255, .1);
        --accent: #45a0ff;
        --accent-soft: rgba(69, 160, 255, .15);
        --shadow: 0 28px 80px rgba(0, 0, 0, .42), 0 2px 12px rgba(0, 0, 0, .22);
      }
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 4%, rgba(80, 155, 255, .15), transparent 34%),
        radial-gradient(circle at 92% 98%, rgba(127, 83, 255, .11), transparent 32%),
        var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea { font: inherit; }
    button { color: inherit; }
    .shell {
      width: min(1080px, calc(100vw - 40px));
      min-height: min(720px, calc(100vh - 56px));
      margin: 28px auto;
      display: grid;
      grid-template-columns: 250px 1fr;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(36px) saturate(1.35);
      -webkit-backdrop-filter: blur(36px) saturate(1.35);
    }
    .sidebar {
      padding: 22px 14px 18px;
      border-right: 1px solid var(--line);
      background: rgba(120, 120, 128, .035);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .brand { display: flex; align-items: center; gap: 11px; padding: 2px 8px 22px; }
    .brand-mark {
      width: 36px; height: 36px; border-radius: 11px;
      display: grid; place-items: center;
      color: white; font-weight: 750; font-size: 14px;
      background: linear-gradient(145deg, #5ea9ff, #5365ed 58%, #8f55df);
      box-shadow: inset 0 1px 1px rgba(255,255,255,.45), 0 5px 14px rgba(53,91,220,.28);
    }
    .brand strong { font-size: 15px; letter-spacing: -.15px; }
    .brand small { display: block; color: var(--secondary); margin-top: 2px; font-size: 11px; }
    .section-label { padding: 0 10px 7px; color: var(--tertiary); font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .65px; }
    .app-list { display: grid; gap: 4px; }
    .app-item {
      width: 100%; border: 0; border-radius: 11px; background: transparent;
      display: flex; align-items: center; gap: 10px; padding: 9px 10px;
      text-align: left; cursor: pointer; transition: .16s ease;
    }
    .app-item:hover { background: var(--surface-soft); }
    .app-item.active { background: var(--accent-soft); }
    .app-icon {
      width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
      color: white; font-size: 12px; font-weight: 720;
      background: linear-gradient(145deg, #8d94a3, #535865);
    }
    .app-item.active .app-icon { background: linear-gradient(145deg, #45a0ff, #5864e8); }
    .app-meta { min-width: 0; }
    .app-meta b { display: block; font-size: 12.5px; font-weight: 620; overflow: hidden; text-overflow: ellipsis; }
    .app-meta span { display: block; margin-top: 2px; color: var(--secondary); font-size: 10.5px; }
    .repo-card {
      margin-top: auto; border: 1px solid var(--line); border-radius: 13px;
      padding: 11px 12px; background: var(--surface-soft);
    }
    .repo-line { display: flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 570; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--tertiary); }
    .dot.clean { background: var(--success); box-shadow: 0 0 0 3px rgba(37,162,68,.12); }
    .dot.dirty { background: var(--warning); box-shadow: 0 0 0 3px rgba(240,154,32,.12); }
    .repo-detail { color: var(--secondary); font-size: 10px; margin: 5px 0 0 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    main { padding: 34px 40px 32px; min-width: 0; }
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
    h1 { margin: 0; font-size: 25px; letter-spacing: -.55px; font-weight: 720; }
    .subtitle { margin: 6px 0 0; color: var(--secondary); font-size: 12.5px; }
    .latest {
      flex: 0 0 auto; padding: 8px 11px; border-radius: 11px;
      color: var(--secondary); background: var(--surface-soft); font-size: 11px;
    }
    .latest b { color: var(--text); font-size: 12px; margin-left: 5px; }
    .form { display: grid; gap: 20px; }
    .field-grid { display: grid; grid-template-columns: 170px 1fr; gap: 16px; }
    label { display: block; margin: 0 0 7px 2px; color: var(--secondary); font-size: 11px; font-weight: 600; }
    input, textarea {
      width: 100%; color: var(--text); border: 1px solid var(--line); outline: none;
      background: var(--surface-solid); border-radius: 12px; transition: .15s ease;
    }
    input { height: 42px; padding: 0 13px; font-size: 13px; }
    textarea { min-height: 150px; resize: vertical; padding: 12px 13px; line-height: 1.55; font-size: 12.5px; }
    input:focus, textarea:focus { border-color: rgba(8,124,255,.55); box-shadow: 0 0 0 3px var(--accent-soft); }
    .dropzone {
      min-height: 112px; border: 1.5px dashed rgba(120,120,128,.33); border-radius: 16px;
      display: grid; place-items: center; padding: 18px; text-align: center;
      background: var(--surface-soft); cursor: pointer; transition: .16s ease;
    }
    .dropzone:hover, .dropzone.dragging { border-color: var(--accent); background: var(--accent-soft); }
    .drop-icon { width: 36px; height: 36px; border-radius: 11px; background: var(--surface-solid); display: grid; place-items: center; margin: 0 auto 8px; font-size: 17px; box-shadow: 0 2px 8px rgba(0,0,0,.07); }
    .drop-title { font-size: 12.5px; font-weight: 620; }
    .drop-help { margin-top: 4px; color: var(--secondary); font-size: 10.5px; }
    .file-chip { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; }
    .file-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .actions { display: flex; align-items: center; gap: 12px; padding-top: 2px; }
    .publish {
      min-width: 126px; height: 42px; border: 0; border-radius: 13px; padding: 0 20px;
      background: var(--accent); color: #fff; font-size: 13px; font-weight: 650;
      cursor: pointer; box-shadow: 0 5px 14px rgba(8,124,255,.2); transition: .16s ease;
    }
    .publish:hover { filter: brightness(1.06); transform: translateY(-1px); }
    .publish:active { transform: translateY(0); }
    .publish:disabled { opacity: .42; cursor: default; transform: none; box-shadow: none; }
    .refresh { width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface-soft); cursor: pointer; }
    .progress { flex: 1; min-width: 0; }
    .progress-track { height: 4px; border-radius: 9px; overflow: hidden; background: var(--surface-soft); }
    .progress-bar { width: 0; height: 100%; background: var(--accent); transition: width .25s ease; }
    .progress-text { margin-top: 6px; color: var(--secondary); font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .notice {
      display: none; margin-bottom: 18px; border-radius: 13px; padding: 11px 13px;
      background: rgba(229,72,77,.1); color: var(--danger); font-size: 11.5px; line-height: 1.45;
      white-space: pre-wrap;
    }
    .notice.show { display: block; }
    .notice.success { color: var(--success); background: rgba(37,162,68,.1); }
    .offline { display: none; min-height: 620px; place-items: center; padding: 40px; text-align: center; }
    .offline.show { display: grid; }
    .offline-card { max-width: 420px; }
    .offline-icon { width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center; margin: 0 auto 18px; background: var(--surface-soft); font-size: 25px; }
    .offline h2 { margin: 0 0 9px; font-size: 20px; }
    .offline p { margin: 0; color: var(--secondary); font-size: 12.5px; line-height: 1.6; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
    @media (max-width: 760px) {
      .shell { width: calc(100vw - 20px); margin: 10px; grid-template-columns: 1fr; border-radius: 22px; }
      .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
      .app-list { display: flex; overflow-x: auto; }
      .repo-card { margin-top: 16px; }
      main { padding: 26px 22px; }
      .field-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <section id="offline" class="offline">
    <div class="offline-card">
      <div class="offline-icon">⌘</div>
      <h2>请启动本地发布服务</h2>
      <p>这个页面不能直接从文件运行。双击仓库中的 <code>start.command</code>，浏览器会自动打开本机控制台；关闭 Terminal 即停止服务。</p>
    </div>
  </section>

  <div id="shell" class="shell" hidden>
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">AU</div>
        <div><strong>AppUpdateHub</strong><small>Local Release Console</small></div>
      </div>
      <div class="section-label">Applications</div>
      <div id="appList" class="app-list"></div>
      <div class="repo-card">
        <div class="repo-line"><i id="repoDot" class="dot"></i><span id="repoStatus">正在读取仓库…</span></div>
        <div id="repoDetail" class="repo-detail"></div>
      </div>
    </aside>

    <main>
      <div class="topbar">
        <div><h1 id="appTitle">发布新版本</h1><p id="appSubtitle" class="subtitle">选择应用并准备 Sparkle 更新</p></div>
        <div class="latest">线上版本 <b id="latestVersion">—</b></div>
      </div>

      <div id="notice" class="notice"></div>
      <form id="releaseForm" class="form">
        <div class="field-grid">
          <div><label for="version">版本号</label><input id="version" autocomplete="off" placeholder="1.0.1" required></div>
          <div><label>更新包</label><div id="dropzone" class="dropzone" role="button" tabindex="0"><div><div class="drop-icon">⇧</div><div id="dropTitle" class="drop-title">选择或拖入 ZIP</div><div id="dropHelp" class="drop-help">将校验 Bundle ID、版本号与签名信息</div></div></div><input id="file" type="file" accept=".zip,application/zip" hidden></div>
        </div>
        <div><label for="notes">更新内容</label><textarea id="notes" placeholder="简洁说明本次新增、优化和修复内容…" required></textarea></div>
        <div class="actions">
          <button id="publish" class="publish" type="submit">发布更新</button>
          <button id="refresh" class="refresh" type="button" title="刷新仓库状态">↻</button>
          <div class="progress"><div class="progress-track"><div id="progressBar" class="progress-bar"></div></div><div id="progressText" class="progress-text">准备就绪</div></div>
        </div>
      </form>
    </main>
  </div>

  <script>
    const ui = Object.fromEntries(['offline','shell','appList','repoDot','repoStatus','repoDetail','appTitle','appSubtitle','latestVersion','notice','releaseForm','version','file','dropzone','dropTitle','dropHelp','notes','publish','refresh','progressBar','progressText'].map(id => [id, document.getElementById(id)]));
    const model = { state: null, app: null, file: null, busy: false };

    function api(path, options = {}) {
      const headers = new Headers(options.headers || {});
      if (model.state?.token) headers.set('X-AppUpdateHub-Token', model.state.token);
      return fetch(path, { ...options, headers }).then(async response => {
        const body = await response.json().catch(() => ({ ok: false, error: `HTTP ${response.status}` }));
        if (!response.ok || !body.ok) throw new Error(body.error || `HTTP ${response.status}`);
        return body;
      });
    }

    function escapeText(value) { const node = document.createElement('span'); node.textContent = value; return node.innerHTML; }
    function initials(name) { return name.replace(/[^A-Za-z0-9]/g, '').slice(0, 2).toUpperCase() || 'AP'; }
    function suggestedVersion(version) {
      const parts = String(version || '').match(/^(\d+)\.(\d+)\.(\d+)$/);
      return parts ? `${parts[1]}.${parts[2]}.${Number(parts[3]) + 1}` : '';
    }
    function bytes(value) {
      if (value < 1024 * 1024) return `${(value / 1024).toFixed(0)} KB`;
      return `${(value / 1024 / 1024).toFixed(1)} MB`;
    }
    function setProgress(percent, text) { ui.progressBar.style.width = `${percent}%`; ui.progressText.textContent = text; }
    function showNotice(message = '', success = false) {
      ui.notice.textContent = message;
      ui.notice.className = `notice${message ? ' show' : ''}${success ? ' success' : ''}`;
    }
    function setBusy(value) {
      model.busy = value;
      ui.publish.disabled = value || !model.state?.repository.clean;
      ui.refresh.disabled = value;
    }

    function render() {
      const state = model.state;
      ui.appList.innerHTML = state.apps.map(app => `<button class="app-item${model.app?.id === app.id ? ' active' : ''}" data-id="${escapeText(app.id)}"><i class="app-icon">${escapeText(initials(app.name))}</i><span class="app-meta"><b>${escapeText(app.name)}</b><span>${escapeText(app.latest?.version ? `v${app.latest.version}` : '尚未发布')}</span></span></button>`).join('');
      ui.appList.querySelectorAll('.app-item').forEach(button => button.addEventListener('click', () => selectApp(button.dataset.id)));
      const repo = state.repository;
      ui.repoDot.className = `dot ${repo.clean ? 'clean' : 'dirty'}`;
      ui.repoStatus.textContent = repo.clean ? '仓库已就绪' : `${repo.changes.length} 项待处理`;
      ui.repoDetail.textContent = `${repo.branch} → ${repo.upstream || `${repo.remote}/${repo.expectedBranch}`}`;
      ui.publish.disabled = model.busy || !repo.clean;
      if (!repo.clean) showNotice(`发布前请先提交当前仓库改动：\n${repo.changes.slice(0, 6).join('\n')}${repo.changes.length > 6 ? '\n…' : ''}`);
      else showNotice();
      renderApp();
    }

    function renderApp() {
      if (!model.app) return;
      ui.appTitle.textContent = model.app.name;
      ui.appSubtitle.textContent = `${model.app.bundleIdentifier || 'Sparkle 应用'} · ${model.app.feedPath}`;
      ui.latestVersion.textContent = model.app.latest?.version ? `v${model.app.latest.version}` : '未发布';
      if (!ui.version.value) ui.version.value = suggestedVersion(model.app.latest?.version);
    }

    function selectApp(id) {
      model.app = model.state.apps.find(app => app.id === id) || model.state.apps[0];
      model.file = null; ui.file.value = ''; ui.version.value = ''; ui.notes.value = '';
      ui.dropTitle.textContent = '选择或拖入 ZIP'; ui.dropHelp.textContent = '将校验 Bundle ID、版本号与签名信息';
      render();
    }

    function chooseFile(file) {
      if (!file || !file.name.toLowerCase().endsWith('.zip')) { showNotice('请选择 ZIP 更新包'); return; }
      model.file = file;
      ui.dropTitle.innerHTML = `<span class="file-chip"><b>ZIP</b><span>${escapeText(file.name)}</span></span>`;
      ui.dropHelp.textContent = bytes(file.size);
      showNotice();
    }

    async function refreshState(keepSelection = true) {
      const selected = keepSelection ? model.app?.id : null;
      const response = await fetch('/api/state', { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      model.state = await response.json();
      model.app = model.state.apps.find(app => app.id === selected) || model.state.apps[0];
      render();
    }

    async function publish(event) {
      event.preventDefault();
      if (model.busy) return;
      if (!model.app || !model.file) { showNotice('请选择要发布的 ZIP 更新包'); return; }
      const version = ui.version.value.trim();
      const notes = ui.notes.value.trim();
      setBusy(true); showNotice();
      try {
        setProgress(8, '检查仓库与发布参数…');
        const prepared = await api('/api/releases', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ appId: model.app.id, version, notes, fileName: model.file.name, fileSize: model.file.size }) });
        setProgress(25, '上传并校验 ZIP…');
        const archive = await api(`/api/releases/${prepared.uploadId}/archive`, { method: 'PUT', headers: { 'Content-Type': 'application/zip' }, body: model.file });
        setProgress(58, `已校验构建 ${archive.build}，生成签名更新源…`);
        const result = await api(`/api/releases/${prepared.uploadId}/publish`, { method: 'POST' });
        setProgress(100, `${result.app} v${result.version} 已提交并推送`);
        showNotice(`发布成功 · ${result.app} v${result.version} (${result.build})`, true);
        model.file = null; ui.file.value = ''; ui.version.value = ''; ui.notes.value = '';
        ui.dropTitle.textContent = '选择或拖入 ZIP'; ui.dropHelp.textContent = '将校验 Bundle ID、版本号与签名信息';
        await refreshState();
      } catch (error) {
        setProgress(0, '发布未完成'); showNotice(error.message || String(error));
      } finally { setBusy(false); }
    }

    ui.dropzone.addEventListener('click', () => ui.file.click());
    ui.dropzone.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') ui.file.click(); });
    ui.file.addEventListener('change', () => chooseFile(ui.file.files[0]));
    ['dragenter','dragover'].forEach(name => ui.dropzone.addEventListener(name, event => { event.preventDefault(); ui.dropzone.classList.add('dragging'); }));
    ['dragleave','drop'].forEach(name => ui.dropzone.addEventListener(name, event => { event.preventDefault(); ui.dropzone.classList.remove('dragging'); }));
    ui.dropzone.addEventListener('drop', event => chooseFile(event.dataTransfer.files[0]));
    ui.releaseForm.addEventListener('submit', publish);
    ui.refresh.addEventListener('click', async () => { try { setProgress(0, '刷新仓库状态…'); await refreshState(); setProgress(0, '准备就绪'); } catch (error) { showNotice(error.message); } });

    (async () => {
      if (location.protocol === 'file:') { ui.offline.classList.add('show'); return; }
      try { await refreshState(false); ui.shell.hidden = false; }
      catch (error) { ui.offline.classList.add('show'); }
    })();
  </script>
</body>
</html>
